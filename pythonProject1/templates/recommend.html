<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recommend Books</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #343a40;
        }

        .navbar {
            padding: 15px 30px;
        }

        .navbar-brand {
            color: white !important;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
            margin-left: 15px;
        }

        .page-title {
            color: white;
            font-size: 50px;
            font-weight: bold;
            margin-top: 50px;
        }

        .search-box {
            margin-top: 25px;
        }

        .card {
            background-color: #454d55;
            border: none;
            border-radius: 10px;
            height: 100%;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img-top {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .book-title {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .book-author {
            color: #dddddd;
            font-size: 16px;
        }

        .message {
            color: #ffc107;
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg" style="background-color:#00a65a">

    <a class="navbar-brand" href="/">
        My Book Recommender
    </a>

    <ul class="navbar-nav ml-auto">

        <li class="nav-item">
            <a class="nav-link" href="/">
                Home
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="/recommend">
                Recommend
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">
                Contact
            </a>
        </li>

    </ul>

</nav>


<!-- Main Content -->
<div class="container">

    <div class="row">

        <div class="col-md-12">

            <h1 class="page-title">
                Recommend Books
            </h1>

            <!-- Search Form -->
            <form
                action="/recommend_books"
                method="post"
                class="search-box"
            >

                <input
                    name="user_input"
                    type="text"
                    class="form-control form-control-lg"
                    placeholder="Enter a book name..."
                    required
                >

                <br>

                <button
                    type="submit"
                    class="btn btn-lg btn-warning"
                >
                    Recommend
                </button>

            </form>

        </div>


        <!-- Message -->
        {% if message %}

        <div class="col-md-12">

            <p class="message">
                {{ message }}
            </p>

        </div>

        {% endif %}


        <!-- Recommended Books -->
        {% if data %}

            <div class="col-md-12">

                <h2 class="text-white mt-5">
                    Recommended Books
                </h2>

            </div>

            {% for i in data %}

            <div
                class="col-lg-3 col-md-4 col-sm-6"
                style="margin-top:40px"
            >

                <div class="card">

                    <img
                        class="card-img-top"
                        src="{{ i[2] }}"
                        alt="{{ i[0] }}"
                    >

                    <div class="card-body">

                        <p class="book-title">
                            {{ i[0] }}
                        </p>

                        <p class="book-author">
                            {{ i[1] }}
                        </p>

                    </div>

                </div>

            </div>

            {% endfor %}

        {% endif %}

    </div>

</div>

</body>
</html>
