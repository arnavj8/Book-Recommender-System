<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Book Recommender</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #343a40;
        }

        .navbar {
            padding: 15px 30px;
        }

        .navbar-brand {
            color: white !important;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
            margin-left: 15px;
        }

        .page-title {
            color: white;
            font-size: 50px;
            font-weight: bold;
            margin-top: 50px;
        }

        .card {
            background-color: #454d55;
            border: none;
            border-radius: 10px;
            height: 100%;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img-top {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .book-title {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .book-author {
            color: #dddddd;
            font-size: 16px;
        }

        .book-info {
            color: #ffc107;
            font-size: 15px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg" style="background-color:#00a65a">

    <a class="navbar-brand" href="/">
        My Book Recommender
    </a>

    <ul class="navbar-nav ml-auto">

        <li class="nav-item">
            <a class="nav-link" href="/">
                Home
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="/recommend">
                Recommend
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">
                Contact
            </a>
        </li>

    </ul>

</nav>


<!-- Main Content -->
<div class="container">

    <div class="row">

        <div class="col-md-12">

            <h1 class="page-title">
                Top 50 Books
            </h1>

        </div>


        <!-- Books -->
        {% for i in range(book_name|length) %}

        <div class="col-lg-3 col-md-4 col-sm-6"
             style="margin-top:40px">

            <div class="card">

                <img
                    class="card-img-top"
                    src="{{ image[i] }}"
                    alt="{{ book_name[i] }}"
                >

                <div class="card-body">

                    <p class="book-title">
                        {{ book_name[i] }}
                    </p>

                    <p class="book-author">
                        {{ author[i] }}
                    </p>

                    <p class="book-info">
                        Votes: {{ votes[i] }}
                    </p>

                    <p class="book-info">
                        Rating: {{ rating[i] }}
                    </p>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
